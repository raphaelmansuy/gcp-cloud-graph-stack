steps:
  # Build EdgeQuake API container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-edgequake-api'
    args:
      - 'buildx'
      - 'build'
      - '--platform=linux/amd64'
      - '--provenance=false'
      - '--sbom=false'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:latest'
      - '-f'
      - './gcp-cloud-graph-stack/dockerfiles/Dockerfile.edgequake-api-simple'
      - '.'

  # Push EdgeQuake API image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-edgequake-api'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:${SHORT_SHA}'
    waitFor: ['build-edgequake-api']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-edgequake-api-latest'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:latest'
    waitFor: ['build-edgequake-api']

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/edgequake-images/edgequake-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '3600s'
